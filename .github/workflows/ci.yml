name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.11"
      - run: make all
      - run: git tag dblp-index-2099.01.01
      - run: uv build
      - run: "! ls dist/paperstack_cli-2099* 2>/dev/null"

      - name: Check the installed wheel and synthetic corpus
        run: |
          uv tool install dist/*.whl
          paperstack --help > /dev/null
          XDG_CONFIG_HOME="$RUNNER_TEMP/config" paperstack corpus add example --path examples/corpus
          XDG_CONFIG_HOME="$RUNNER_TEMP/config" paperstack review show example2026paperstack --brief
          XDG_CONFIG_HOME="$RUNNER_TEMP/config" paperstack viewer build --output "$RUNNER_TEMP/site"
          test -f "$RUNNER_TEMP/site/assets/marked.min.js"
          test -f "$RUNNER_TEMP/site/assets/marked.LICENSE"

  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.14"
      - run: uv run --group test pytest -q
