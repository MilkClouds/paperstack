[project]
name = "paperstack-cli"
version = "0.3.1"
description = "Review, inspect, and retrieve research sources from one CLI"
readme = "README.md"
license = "Apache-2.0"
license-files = [
    "LICENSE",
    "src/paperstack/content/vendor/latexpand.LICENSE",
    "scripts/build/vendor/marked.LICENSE",
]
authors = [{ name = "MilkClouds" }]
keywords = ["research", "papers", "arxiv", "dblp", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.11.4" # First 3.11 release with tarfile.extractall(filter=).
dependencies = [
    "filelock>=3.20",
    "polars>=1.43",
    "python-dotenv>=1.2.2",
    "pyyaml>=6",
]

[project.optional-dependencies]
pdf = ["pymupdf4llm>=0.0.17"]
full = ["pymupdf4llm>=0.0.17"]

[dependency-groups]
lint = ["ruff>=0.12"]
test = ["pytest>=8"]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
]

[project.urls]
Repository = "https://github.com/MilkClouds/paperstack"
Issues = "https://github.com/MilkClouds/paperstack/issues"

[project.scripts]
paperstack = "paperstack.entrypoint:main"

[tool.hatch.build.targets.wheel]
packages = ["src/paperstack"]

[tool.hatch.build.targets.wheel.force-include]
"scripts/build/site" = "paperstack/viewer_assets/site"
"scripts/build/vendor/marked.min.js" = "paperstack/viewer_assets/vendor/marked.min.js"
"scripts/build/vendor/marked.LICENSE" = "paperstack/viewer_assets/vendor/marked.LICENSE"
"scripts/build/vendor/README.md" = "paperstack/viewer_assets/vendor/README.md"

[tool.hatch.build.targets.sdist]
include = [
    "/src/paperstack",
    "/scripts/build/site",
    "/scripts/build/vendor",
    "/README.md",
    "/THIRD_PARTY_NOTICES.md",
    "/pyproject.toml",
    "/LICENSE",
]

[tool.ruff]
line-length = 119

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
